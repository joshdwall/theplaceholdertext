name: Promote ThePlaceholderText

# Isolated cloud promote for joshdwall/theplaceholdersite-business ONLY.
# Deploys this repo's Worker + assets to theplaceholdertext.com (and www).
# Done = this workflow green + live verify. Laptop wrangler is not Done.
#
# Secrets (repo Actions secrets), either:
#   CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID  (preferred for public repo)
#   OR INFISICAL_CLIENT_ID + INFISICAL_CLIENT_SECRET  (reads /cloudflare)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = credential resolve + dry-run only'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      confirm_production:
        description: 'PRODUCTION gate — type promote-production'
        required: true
        default: ''
        type: string
      mode:
        description: 'promote = production deploy; preview = versions upload only'
        required: false
        default: 'promote'
        type: choice
        options: ['promote', 'preview']
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/404.html'
      - 'public/products/**'
      - 'public/theme/**'
      - 'public/media/**'
      - 'public/vendor/**'
      - 'src/**'
      - 'config/**'
      - 'scripts/**'
      - 'site.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/promote.yml'

concurrency:
  group: promote-theplaceholdersite-business
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Production gate (dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true' && inputs.mode == 'promote' && inputs.confirm_production != 'promote-production' }}
        run: |
          echo "::error::Production deploy needs confirm_production=promote-production"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve Cloudflare credentials
        id: cf
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Always write into GITHUB_ENV. Never re-bind secrets in later steps —
          # that overwrote Infisical values and caused CF 7003 (bad account id).
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            if [ "${#CLOUDFLARE_ACCOUNT_ID}" -lt 32 ]; then
              echo "::error::CLOUDFLARE_ACCOUNT_ID length looks wrong (${#CLOUDFLARE_ACCOUNT_ID})"
              exit 1
            fi
            {
              echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}"
              echo "CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}"
            } >> "$GITHUB_ENV"
            echo "::add-mask::${CLOUDFLARE_API_TOKEN}"
            echo "mode=actions-secrets" >> "$GITHUB_OUTPUT"
            echo "Resolved Cloudflare credentials from Actions secrets (accountLen=${#CLOUDFLARE_ACCOUNT_ID})"
            exit 0
          fi
          if [ -z "${INFISICAL_CLIENT_ID:-}" ] || [ -z "${INFISICAL_CLIENT_SECRET:-}" ]; then
            echo "::error::Need CLOUDFLARE_API_TOKEN+CLOUDFLARE_ACCOUNT_ID or Infisical UA secrets"
            exit 1
          fi
          tok=$(curl -sS -X POST "https://app.infisical.com/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${INFISICAL_CLIENT_ID}\",\"clientSecret\":\"${INFISICAL_CLIENT_SECRET}\"}" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s);if(!j.accessToken){console.error('no token');process.exit(1)};console.log(j.accessToken)})")
          fetch_secret() {
            local path="$1" name="$2"
            curl -sS "https://app.infisical.com/api/v3/secrets/raw?workspaceId=41982513-3430-4531-a227-9aa124fe024d&environment=prod&secretPath=${path}" \
              -H "Authorization: Bearer ${tok}" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s);const row=(j.secrets||[]).find(x=>x.secretKey===process.argv[1]);if(!row){console.error('missing '+process.argv[1]);process.exit(1)};process.stdout.write(row.secretValue)})" "$name"
          }
          CF_TOKEN=$(fetch_secret /cloudflare CLOUDFLARE_API_TOKEN || true)
          if [ -z "${CF_TOKEN:-}" ]; then
            CF_TOKEN=$(fetch_secret /cloudflare agents-write)
          fi
          CF_ACCOUNT=$(fetch_secret /cloudflare CLOUDFLARE_ACCOUNT_ID)
          if [ "${#CF_ACCOUNT}" -lt 32 ]; then
            echo "::error::Infisical CLOUDFLARE_ACCOUNT_ID length looks wrong (${#CF_ACCOUNT})"
            exit 1
          fi
          echo "::add-mask::${CF_TOKEN}"
          {
            echo "CLOUDFLARE_API_TOKEN=${CF_TOKEN}"
            echo "CLOUDFLARE_ACCOUNT_ID=${CF_ACCOUNT}"
          } >> "$GITHUB_ENV"
          echo "mode=infisical" >> "$GITHUB_OUTPUT"
          echo "Resolved Cloudflare credentials from Infisical (accountLen=${#CF_ACCOUNT})"

      - name: Dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
        run: |
          echo "Dry-run ok (mode=${{ steps.cf.outputs.mode }})"
          node scripts/promote.mjs promote --confirm --dry-run

      - name: Preview version upload
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true' && inputs.mode == 'preview' }}
        run: node scripts/promote.mjs preview

      - name: Promote production
        if: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true' && inputs.mode == 'promote') }}
        env:
          CONFIRM_PRODUCTION: promote-production
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Cloudflare credentials missing after resolve step"
            exit 1
          fi
          node scripts/promote.mjs promote --confirm
          {
            echo "## ThePlaceholderText promote"
            echo "- sha: \`$GITHUB_SHA\`"
            echo "- live: https://theplaceholdertext.com/"
            echo "- creds: \`${{ steps.cf.outputs.mode }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
